<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ssh-portal</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="bar">
    <span class="wordmark">ssh-portal</span>
    <nav class="views" aria-label="Views">
      <button type="button" data-view="screens" aria-current="page">Screens</button>
      <button type="button" data-view="terminals">Terminals</button>
      <button type="button" data-view="run">Run command</button>
    </nav>
    <div class="fleet">
      <span id="fleet-summary" aria-live="polite"></span>
      <button type="button" class="btn quiet" id="fleet-refresh">Check again</button>
      <button type="button" class="btn" id="add-open">Add machine</button>
    </div>
  </header>

  <main>
    <section id="view-screens" class="view">
      <div class="wall" id="wall"></div>
    </section>

    <section id="view-focus" class="view" hidden>
      <div class="focus-bar">
        <button type="button" class="btn quiet" id="focus-back">Back to all screens</button>
        <span class="led" id="focus-led" aria-hidden="true"></span>
        <span class="name" id="focus-name"></span>
        <span class="where" id="focus-where"></span>
        <span class="actions">
          <button type="button" class="btn quiet" id="focus-terminal">Terminal</button>
          <button type="button" class="btn quiet" id="focus-scale" aria-pressed="true">Fit to window</button>
          <button type="button" class="btn quiet" id="focus-full">Full screen</button>
          <button type="button" class="btn quiet" id="focus-remove">Remove</button>
        </span>
      </div>
      <div class="focus-screen" id="focus-screen"></div>
    </section>

    <section id="view-terminals" class="view" hidden>
      <div class="tabs" id="term-tabs" role="tablist" aria-label="Open terminals"></div>
      <div class="term-stage" id="term-stage"></div>
    </section>

    <section id="view-run" class="view" hidden>
      <form class="run" id="run-form">
        <label class="field-label" for="run-command">Command</label>
        <textarea id="run-command" rows="3" spellcheck="false" autocomplete="off"
                  placeholder="uptime; df -h /"></textarea>
        <div class="run-row">
          <fieldset class="picks" id="run-picks">
            <legend class="field-label">Machines</legend>
          </fieldset>
          <label class="limit">Time limit
            <input id="run-timeout" type="number" min="1" max="3600" value="60"> s
          </label>
          <button type="submit" class="btn primary" id="run-submit">Run</button>
        </div>
        <p class="hint">Ctrl+Enter runs. Commands that ask for input, like sudo's password prompt, need a terminal instead.</p>
      </form>
      <div class="results" id="run-results"></div>
    </section>
  </main>

  <dialog id="add-dialog" aria-labelledby="add-title">
    <form id="add-form" novalidate>
      <div class="dialog-body">
        <h2 id="add-title">Add a machine</h2>
        <p class="dialog-intro">
          Run <code>sudo bash setup.sh</code> on the machine first. It shows the address, user and
          fingerprint to use here.
        </p>
        <div class="fields">
          <label class="span-2">Name
            <input id="add-name" autocomplete="off" spellcheck="false" placeholder="office">
          </label>
          <label class="span-2">Address
            <input id="add-address" autocomplete="off" spellcheck="false" placeholder="192.168.1.20">
          </label>
          <label class="span-2">User on that machine
            <input id="add-user" autocomplete="off" spellcheck="false">
          </label>
          <label>Port
            <input id="add-port" type="number" min="1" max="65535" placeholder="22">
          </label>
          <label>Display
            <input id="add-display" autocomplete="off" spellcheck="false" placeholder=":0">
          </label>
        </div>
        <button type="button" class="btn" id="add-check">Check connection</button>
        <ol class="checklist" id="add-checklist" aria-live="polite" hidden></ol>
        <p class="form-error" id="add-error" role="alert"></p>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn quiet" id="add-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="add-save">Add machine</button>
      </div>
    </form>
  </dialog>
</body>
</html>
