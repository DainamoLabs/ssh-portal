[project]
name = "ssh-portal"
version = "0.1.0"
description = "See and control the Linux machines on your LAN from one browser tab, over SSH."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.17",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
ssh-portal = "ssh_portal.__main__:main"

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
